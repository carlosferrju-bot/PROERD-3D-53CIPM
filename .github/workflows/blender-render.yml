name: PROERD 3D Full Render

on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - 'assets/**'
      - '.github/workflows/blender-render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libglu1-mesa mesa-utils
          blender --version
          ffmpeg -version | head -n 1
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1' || true

      - name: Build and render full realistic Cycles scene
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LIBGL_DRIVERS_PATH: '/usr/lib/x86_64-linux-gnu/dri'
        run: |
          mkdir -p /tmp/proerd_full_frames
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so.1
          blender --background --python blender/scripts/render_full_pipeline.py
          test -s /tmp/PROERD_Licao03_full_realistic.blend
          test -s /tmp/proerd_full_frames/frame_0001.png
          test -s /tmp/proerd_full_frames/frame_2111.png

      - name: Encode complete visual MP4
        run: |
          ffmpeg -y -framerate 24 -i /tmp/proerd_full_frames/frame_%04d.png \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -movflags +faststart /tmp/PROERD_Licao03_VISUAL.mp4
          ls -lh /tmp/PROERD_Licao03_VISUAL.mp4

      - name: Validate complete visual video
        run: |
          test -s /tmp/PROERD_Licao03_VISUAL.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 /tmp/PROERD_Licao03_VISUAL.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 /tmp/PROERD_Licao03_VISUAL.mp4

      - name: Upload complete visual video
        uses: actions/upload-artifact@v4
        with:
          name: PROERD-Licao03-VISUAL-87s
          path: /tmp/PROERD_Licao03_VISUAL.mp4
          if-no-files-found: error

      - name: Upload Blender scene
        uses: actions/upload-artifact@v4
        with:
          name: PROERD-Licao03-FINAL-blend
          path: /tmp/PROERD_Licao03_full_realistic.blend
          if-no-files-found: error

      - name: Upload render workspace
        uses: actions/upload-artifact@v4
        with:
          name: proerd-3d-workspace-full
          path: |
            blender/
            assets/
